name: Build H700 (Anbernic RG40XX H)

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build-h700:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: make setup

      - name: Build H700
        run: make h700
        env:
          PLATFORM: h700

      - name: Package H700 Update
        run: |
          mkdir -p h700-staging/bin
          mkdir -p h700-staging/Tools
          cp -r build/SYSTEM/h700/bin/* h700-staging/bin/
          cp -r build/EXTRAS/Tools/h700/* h700-staging/Tools/
          cd h700-staging && zip -r ../h700-update.zip bin Tools

      - name: Upload H700 Update Artifact
        uses: actions/upload-artifact@v4
        with:
          name: h700-update
          path: h700-update.zip
