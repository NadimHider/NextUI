name: Build H700 (Anbernic RG40XX H)

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build-h700:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: make setup

      - name: Build H700
        run: make build PLATFORM=h700 COMPILE_CORES=false
        env:
          PLATFORM: h700

      - name: Package H700 Update
        run: |
          mkdir -p h700-staging/bin
          mkdir -p h700-staging/Tools/Settings.pak
          mkdir -p h700-staging/Tools/LedControl.pak
          mkdir -p h700-staging/Tools/CleanRomset.pak

          cp workspace/all/nextui/build/h700/nextui.elf h700-staging/bin/
          cp workspace/all/settings/build/h700/settings.elf h700-staging/Tools/Settings.pak/
          cp workspace/all/ledcontrol/build/h700/ledcontrol.elf h700-staging/Tools/LedControl.pak/
          if [ -d skeleton/EXTRAS/Tools/h700/CleanRomset.pak ]; then cp -r skeleton/EXTRAS/Tools/h700/CleanRomset.pak/* h700-staging/Tools/CleanRomset.pak/; fi

          if [ -f workspace/all/minarch/build/h700/minarch.elf ]; then cp workspace/all/minarch/build/h700/minarch.elf h700-staging/bin/; fi
          if [ -f workspace/all/nextval/build/h700/nextval.elf ]; then cp workspace/all/nextval/build/h700/nextval.elf h700-staging/bin/; fi
          if [ -f workspace/all/syncsettings/build/h700/syncsettings.elf ]; then cp workspace/all/syncsettings/build/h700/syncsettings.elf h700-staging/bin/; fi
          if [ -f workspace/h700/keymon/keymon.elf ]; then cp workspace/h700/keymon/keymon.elf h700-staging/bin/; fi

          cd h700-staging && zip -r ../h700-update.zip bin Tools

      - name: Upload H700 Update Artifact
        uses: actions/upload-artifact@v4
        with:
          name: h700-update
          path: h700-update.zip
